plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
}
group = 'org.itonkung'
version = project.mod_version
base { archivesName = 'Easylife-in-Siamcraft-26.3' }
repositories {
    mavenCentral()
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
    modCompileOnly 'com.terraformersmc:modmenu:21.0.0'
}
loom {
    mods {
        scautoauction {
            sourceSet sourceSets.main
        }
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
